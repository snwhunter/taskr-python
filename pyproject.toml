[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskr"
version = "0.1.0"
description = "Task storage backed by Google Sheets"
requires-python = ">=3.11"
dependencies = ["gspread>=6.0,<7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]

